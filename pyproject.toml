[project]
name = "local-memory"
version = "0.1.0"
description = "Local-first hybrid-retrieval memory service for coding agents (MCP)"
readme = "README.md"
authors = [
    { name = "Jakub Gonczarek", email = "kuba@gonczarek.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.7.0",
    "fastmcp>=4.0.10",
    "numpy>=2.0",
    # Used by `local-memory browse`. Declared explicitly rather than relied on
    # transitively via fastmcp -> rich-rst, so a dependency change upstream
    # cannot silently break the viewer.
    "rich>=13.6",
]

[project.scripts]
local-memory = "local_memory.cli:main"
local-memory-stdio = "local_memory.mcp_stdio:main"
local-memory-http = "local_memory.mcp_http:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
